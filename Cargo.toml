[package]
name = "oxiguitar-audio-cpal"
description = "The code OxiGuitar's audio-device plugins share: a stream on one of cpal's hosts, calling the core from the device's callback."
# Released with the Release button of oxiguitar-packages; 0.0.0 until the
# first release, which gives the version in full (0.1.0).
version = "0.2.1"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-audio-cpal"
homepage = "https://github.com/mateusrdp/oxiguitar-audio-cpal"
publish = false

[dependencies]
# The SDK, at the same tag as the four plugins that use this crate: its
# `Service` and `Host` must be their types. Move it and the plugins' tags
# together.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.23.0" }
# Each plugin adds the features of its own host (the PipeWire plugin's
# `pipewire`) on its own cpal dependency; on Linux cpal always builds its
# ALSA host too (Mateus, 25 Oct 2026: accepted).
cpal = { version = "0.18.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# Its own workspace, wherever the folder is copied.
[workspace]
